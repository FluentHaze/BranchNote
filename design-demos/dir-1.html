<body class="light"><div class="app">
<aside class="sidebar">
<div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M10 8v17M23 8v3c0 7-13 4-13 12" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="7" r="3" fill="currentColor"/><circle cx="23" cy="7" r="3" fill="currentColor"/><circle cx="10" cy="25" r="3" fill="currentColor"/></svg><span>BranchNote</span></div>
<div class="nav-label">项目</div><nav><button class="project active" data-project="BranchNote" data-short="B"><i></i><span>BranchNote</span></button>
<button class="project " data-project="活动项目" data-short="A"><i></i><span>活动项目</span></button>

<div class="sidebar-bottom"><button data-settings aria-label="项目设置">⚙ <span>项目设置</span></button></div>
</aside>
<main class="main">
<header class="topbar"><span class="crumb">工作空间 / 功能分支</span><select class="project-mobile" aria-label="切换项目"><option>BranchNote</option><option>活动项目</option><option>落地页</option></select><span class="prototype">A · 轻量清单 / 交互演示</span></header>
<div class="content">
<div class="heading"><div><h1 class="project-title">BranchNote</h1><p>功能分支</p></div><button class="primary" data-add>＋ 添加分支</button></div>
<div class="targets"><span>MR 目标</span><button data-settings>测试 <code>origin/test</code></button><button data-settings>发布 <code>origin/release</code></button><button data-settings aria-label="编辑目标">⋯</button></div>
<div class="controls"><div class="tabs"><button data-filter="all" class="active">全部 5</button><button data-filter="pending">待提交</button><button data-filter="mr">MR 待合并</button></div><input class="search" placeholder="搜索分支…" aria-label="搜索功能分支"></div>
<div class="list-head"><label class="check"><input type="checkbox" aria-label="全选分支" onchange="picked=this.checked?new Set(data.map((_,i)=>i)):new Set();render()"></label><span>功能 / 分支</span><span>测试</span><span>发布</span></div>
<div class="rows"></div>

</div>
</main>
<aside class="submit-pane"><h2>提交 MR</h2><div class="pane-count"><span data-count>2</span></div><span class="tag">已选功能分支</span><div class="pane-list"></div><label class="stage-label" for="pane-stage">提交阶段</label><select id="pane-stage"><option value="test">测试 · origin/test</option><option value="release">发布 · origin/release</option></select><button class="primary" data-submit="">提交 MR</button><p>多个功能分支汇总成一条 MR。</p><p>冲突在临时分支解决。</p></aside>
</div>
<div class="actionbar"><strong>已选 <span data-count>2</span> 个分支</strong><button class="secondary" data-submit="test">提交测试</button><button class="primary" data-submit="release">提交发布</button></div>
<dialog id="submit-dialog"><div class="dialog-top"><h2>提交 MR</h2><button data-close="submit-dialog" aria-label="关闭提交面板">×</button></div><p class="dialog-copy">将 <strong id="dialog-count">2</strong> 个功能分支汇总为一条 MR。</p><label class="stage-label" for="mr-stage">目标阶段</label><select id="mr-stage"><option value="test">测试</option><option value="release">发布</option></select><p><code id="mr-target">origin/test</code></p><p class="dialog-copy">如有冲突，在临时分支解决后继续。</p><div class="dialog-actions"><button class="secondary" data-close="submit-dialog">取消</button><button class="primary" data-confirm>创建 MR（演示）</button></div></dialog>
<dialog id="settings-dialog"><div class="dialog-top"><h2>项目设置</h2><button data-close="settings-dialog" aria-label="关闭项目设置">×</button></div><label class="stage-label">测试 MR 目标</label><select><option>origin/test</option><option>origin/qa</option></select><label class="stage-label">发布 MR 目标</label><select><option>origin/release</option><option>origin/main</option></select><p class="dialog-copy">此处展示设置排版，不修改真实配置。</p><div class="dialog-actions"><button class="primary" data-close="settings-dialog">完成</button></div></dialog>
<dialog id="add-dialog"><div class="dialog-top"><h2>添加功能分支</h2><button data-close="add-dialog" aria-label="关闭添加面板">×</button></div><p class="dialog-copy">正式版从关联仓库选择；此处仅演示交互。</p><label class="stage-label" for="branch-input">功能名称</label><input id="branch-input" class="search" style="max-width:none;width:100%" placeholder="输入演示功能名称"><div class="dialog-actions"><button class="primary" data-add-confirm>添加到列表</button></div></dialog>
<div class="toast" role="status" hidden></div>
<script>const data=[["登录与权限","feature/auth-permissions","待提交","待提交"],["批量提交 MR","feature/batch-submit","MR 待合并","待提交"],["冲突恢复流程","fix/conflict-recovery","已合并","待提交"],["项目与仓库关联","feature/project-link","已合并","MR 待合并"],["移动端布局适配","fix/mobile-layout","待提交","待提交"]];let picked=new Set([0,2]);let filter='all';let query='';const $=s=>document.querySelector(s);
function status(s,label=''){return '<span class="state '+(s==='已合并'?'done':s==='MR 待合并'?'pending':'empty')+'">'+label+s+'</span>'}
function render(){const shown=data.map((b,i)=>({b,i})).filter(({b})=>(filter==='all'||filter==='pending'&&b[2]==='待提交'||filter==='mr'&&b[2]==='MR 待合并')&&b.join(' ').toLowerCase().includes(query.toLowerCase()));$('.rows').innerHTML=shown.map(({b,i})=>'<article class="row '+(picked.has(i)?'selected':'')+'"><label class="check"><input type="checkbox" aria-label="选择 '+b[0]+'" data-id="'+i+'" '+(picked.has(i)?'checked':'')+'></label><div class="info"><span class="title">'+b[0]+'</span><code class="branch">'+b[1]+'</code><div class="mobile-state">'+status(b[2],'测试 ')+status(b[3],'发布 ')+'</div></div>'+status(b[2])+status(b[3])+'</article>').join('')||'<p class="empty">没有匹配的功能分支</p>';document.querySelectorAll('[data-count]').forEach(e=>e.textContent=picked.size);document.querySelectorAll('[data-submit]').forEach(e=>e.disabled=!picked.size);const pane=$('.pane-list');if(pane)pane.innerHTML=[...picked].map(i=>data[i][0]).join('<br>')||'从左侧选择功能分支';}
document.addEventListener('change',e=>{if(e.target.dataset.id){const i=Number(e.target.dataset.id);e.target.checked?picked.add(i):picked.delete(i);render()}if(e.target.matches('.project-mobile'))$('.project-title').textContent=e.target.value;});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(t=>t.classList.toggle('active',t===b));render()}if(b.dataset.project){document.querySelectorAll('[data-project]').forEach(t=>t.classList.toggle('active',t===b));$('.project-title').textContent=b.dataset.project;toast('已切换项目演示视图')}if(b.hasAttribute('data-submit')){const stage=b.dataset.submit||$('#pane-stage')?.value||'test';$('#mr-stage').value=stage;$('#dialog-count').textContent=picked.size;$('#mr-target').textContent=stage==='test'?'origin/test':'origin/release';$('#submit-dialog').showModal()}if(b.dataset.close)$('#'+b.dataset.close).close();if(b.hasAttribute('data-settings'))$('#settings-dialog').showModal();if(b.hasAttribute('data-add'))$('#add-dialog').showModal();if(b.hasAttribute('data-add-confirm')){const name=$('#branch-input').value.trim();if(!name){$('#branch-input').focus();return;}data.push([name,'feature/'+name,'待提交','待提交']);$('#add-dialog').close();render();toast('已添加演示分支')}if(b.hasAttribute('data-confirm')){const stage=$('#mr-stage').value;picked.forEach(i=>data[i][stage==='test'?2:3]='MR 待合并');$('#submit-dialog').close();picked.clear();render();toast('演示：MR 已创建，等待平台合并')}});
$('.search').addEventListener('input',e=>{query=e.target.value;render()});$('#mr-stage').addEventListener('change',e=>$('#mr-target').textContent=e.target.value==='test'?'origin/test':'origin/release');function toast(text){const t=$('.toast');t.textContent=text;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2500)}render();</script>
