<dialog id=&quot;submit-dialog&quot;><div class=&quot;dialog-top&quot;><h2>提交 MR</h2><button data-close=&quot;submit-dialog&quot; aria-label=&quot;关闭提交面板&quot;>×</button></div><p class=&quot;dialog-copy&quot;>将 <strong id=&quot;dialog-count&quot;>2</strong> 个功能分支汇总为一条 MR。</p><label class=&quot;stage-label&quot; for=&quot;mr-stage&quot;>目标阶段</label><select id=&quot;mr-stage&quot;><option value=&quot;test&quot;>测试</option><option value=&quot;release&quot;>发布</option></select><p><code id=&quot;mr-target&quot;>origin/test</code></p><p class=&quot;dialog-copy&quot;>如有冲突，在临时分支解决后继续。</p><div class=&quot;dialog-actions&quot;><button class=&quot;secondary&quot; data-close=&quot;submit-dialog&quot;>取消</button><button class=&quot;primary&quot; data-confirm>创建 MR（演示）</button></div></dialog>
<dialog id=&quot;settings-dialog&quot;><div class=&quot;dialog-top&quot;><h2>项目设置</h2><button data-close=&quot;settings-dialog&quot; aria-label=&quot;关闭项目设置&quot;>×</button></div><label class=&quot;stage-label&quot;>测试 MR 目标</label><select><option>origin/test</option><option>origin/qa</option></select><label class=&quot;stage-label&quot;>发布 MR 目标</label><select><option>origin/release</option><option>origin/main</option></select><p class=&quot;dialog-copy&quot;>此处展示设置排版，不修改真实配置。</p><div class=&quot;dialog-actions&quot;><button class=&quot;primary&quot; data-close=&quot;settings-dialog&quot;>完成</button></div></dialog>
<dialog id=&quot;add-dialog&quot;><div class=&quot;dialog-top&quot;><h2>添加功能分支</h2><button data-close=&quot;add-dialog&quot; aria-label=&quot;关闭添加面板&quot;>×</button></div><p class=&quot;dialog-copy&quot;>正式版从关联仓库选择；此处仅演示交互。</p><label class=&quot;stage-label&quot; for=&quot;branch-input&quot;>功能名称</label><input id=&quot;branch-input&quot; class=&quot;search&quot; style=&quot;max-width:none;width:100%&quot; placeholder=&quot;输入演示功能名称&quot;><div class=&quot;dialog-actions&quot;><button class=&quot;primary&quot; data-add-confirm>添加到列表</button></div></dialog>
<div class=&quot;toast&quot; role=&quot;status&quot; hidden></div>
<script>const data=[[&quot;登录与权限&quot;,&quot;feature/auth-permissions&quot;,&quot;待提交&quot;,&quot;待提交&quot;],[&quot;批量提交 MR&quot;,&quot;feature/batch-submit&quot;,&quot;MR 待合并&quot;,&quot;待提交&quot;],[&quot;冲突恢复流程&quot;,&quot;fix/conflict-recovery&quot;,&quot;已合并&quot;,&quot;待提交&quot;],[&quot;项目与仓库关联&quot;,&quot;feature/project-link&quot;,&quot;已合并&quot;,&quot;MR 待合并&quot;],[&quot;移动端布局适配&quot;,&quot;fix/mobile-layout&quot;,&quot;待提交&quot;,&quot;待提交&quot;]];let picked=new Set([0,2]);let filter='all';let query='';const $=s=>document.querySelector(s);
function status(s,label=''){return '<span class=&quot;state '+(s==='已合并'?'done':s==='MR 待合并'?'pending':'empty')+'&quot;>'+label+s+'</span>'}
function render(){const shown=data.map((b,i)=>({b,i})).filter(({b})=>(filter==='all'||filter==='pending'&amp;&amp;b[2]==='待提交'||filter==='mr'&amp;&amp;b[2]==='MR 待合并')&amp;&amp;b.join(' ').toLowerCase().includes(query.toLowerCase()));$('.rows').innerHTML=shown.map(({b,i})=>'<article class=&quot;row '+(picked.has(i)?'selected':'')+'&quot;><label class=&quot;check&quot;><input type=&quot;checkbox&quot; aria-label=&quot;选择 '+b[0]+'&quot; data-id=&quot;'+i+'&quot; '+(picked.has(i)?'checked':'')+'></label><div class=&quot;info&quot;><span class=&quot;title&quot;>'+b[0]+'</span><code class=&quot;branch&quot;>'+b[1]+'</code><div class=&quot;mobile-state&quot;>'+status(b[2],'测试 ')+status(b[3],'发布 ')+'</div></div>'+status(b[2])+status(b[3])+'</article>').join('')||'<p class=&quot;empty&quot;>没有匹配的功能分支</p>';document.querySelectorAll('[data-count]').forEach(e=>e.textContent=picked.size);document.querySelectorAll('[data-submit]').forEach(e=>e.disabled=!picked.size);const pane=$('.pane-list');if(pane)pane.innerHTML=[...picked].map(i=>data[i][0]).join('<br>')||'从左侧选择功能分支';}
document.addEventListener('change',e=>{if(e.target.dataset.id){const i=Number(e.target.dataset.id);e.target.checked?picked.add(i):picked.delete(i);render()}if(e.target.matches('.project-mobile'))$('.project-title').textContent=e.target.value;});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.filter){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(t=>t.classList.toggle('active',t===b));render()}if(b.dataset.project){document.querySelectorAll('[data-project]').forEach(t=>t.classList.toggle('active',t===b));$('.project-title').textContent=b.dataset.project;toast('已切换项目演示视图')}if(b.hasAttribute('data-submit')){const stage=b.dataset.submit||$('#pane-stage')?.value||'test';$('#mr-stage').value=stage;$('#dialog-count').textContent=picked.size;$('#mr-target').textContent=stage==='test'?'origin/test':'origin/release';$('#submit-dialog').showModal()}if(b.dataset.close)$('#'+b.dataset.close).close();if(b.hasAttribute('data-settings'))$('#settings-dialog').showModal();if(b.hasAttribute('data-add'))$('#add-dialog').showModal();if(b.hasAttribute('data-add-confirm')){const name=$('#branch-input').value.trim();if(!name){$('#branch-input').focus();return;}data.push([name,'feature/'+name,'待提交','待提交']);$('#add-dialog').close();render();toast('已添加演示分支')}if(b.hasAttribute('data-confirm')){const stage=$('#mr-stage').value;picked.forEach(i=>data[i][stage==='test'?2:3]='MR 待合并');$('#submit-dialog').close();picked.clear();render();toast('演示：MR 已创建，等待平台合并')}});
$('.search').addEventListener('input',e=>{query=e.target.value;render()});$('#mr-stage').addEventListener('change',e=>$('#mr-target').textContent=e.target.value==='test'?'origin/test':'origin/release');function toast(text){const t=$('.toast');t.textContent=text;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2500)}render();</script>
</body></html>"></iframe></div><h2>F 双栏选单</h2><small>备选方向</small></section></div></html>
