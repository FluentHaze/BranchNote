name: BranchNote 0.2.7 release validation

on:
  push:
    branches: [ci/branchnote-v0.2.7-verification]
    paths: ['.github/workflows/release-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branchnote-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/ci/branchnote-v0.2.7-verification'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ELECTRON_BUILDER_PUBLISH: never
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and test
        run: |
          npm ci
          npm test
          npm run build
      - name: Exercise updater UI in Electron
        id: updater_ui
        continue-on-error: true
        run: npm run test:update-ui
      - name: Build candidate installers without publishing
        run: npm run pack:${{ matrix.platform }}
      - name: Verify version and checked-in source
        shell: bash
        run: |
          node -e 'if (require("./package.json").version !== "0.2.7") process.exit(1)'
          git diff --check
      - name: Download previous public installer
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == win ]]; then
            asset="BranchNote-Setup-0.2.6-x64.exe"
          else
            asset="BranchNote-0.2.6-mac-$ARCH.dmg"
          fi
          mkdir -p "$RUNNER_TEMP/branchnote-baseline"
          gh release download v0.2.6 --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --dir "$RUNNER_TEMP/branchnote-baseline"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.2.6" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          node -e 'const a=process.argv;const h=require("node:crypto").createHash("sha256");const stream=require("node:fs").createReadStream(a[1]);stream.on("data",b=>h.update(b));stream.on("end",()=>{if("sha256:"+h.digest("hex")!==a[2]) process.exitCode=1;});' "$RUNNER_TEMP/branchnote-baseline/$asset" "$digest"
      - name: Verify Windows install, launch and in-place upgrade
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'branchnote-install'
          $profile = Join-Path $env:RUNNER_TEMP 'branchnote-profile'
          $app = Join-Path $install 'BranchNote.exe'
          function Install-Version([string]$installer, [string]$version) {
            $p = Start-Process -FilePath $installer -ArgumentList "/S /D=$install" -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Installer exit code: $($p.ExitCode)" }
            $actual = (Get-Item -LiteralPath $app).VersionInfo.ProductVersion
            if ($actual -notin @($version, "$version.0")) { throw "Expected $version, got $actual" }
          }
          function Check-Launch {
            $p = Start-Process -FilePath $app -ArgumentList "--user-data-dir=`"$profile`"" -PassThru
            try {
              for ($i = 0; $i -lt 30; $i++) {
                Start-Sleep -Seconds 1
                $p.Refresh()
                if ($p.HasExited) { throw "BranchNote exited: $($p.ExitCode)" }
                if ($p.MainWindowHandle -ne 0) { return }
              }
              throw 'No visible BranchNote window appeared'
            } finally {
              if (!$p.HasExited) {
                Stop-Process -Id $p.Id
                $p.WaitForExit()
              }
            }
          }
          Install-Version (Join-Path $env:RUNNER_TEMP 'branchnote-baseline/BranchNote-Setup-0.2.6-x64.exe') '0.2.6'
          Check-Launch
          Install-Version (Join-Path $PWD 'release/win/BranchNote-Setup-0.2.7-x64.exe') '0.2.7'
          Check-Launch
      - name: Verify macOS disk images, launch and in-place upgrade
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/branchnote-test"
          mkdir -p "$root"
          install() {
            local image="$1" expected="$2" mount
            mount="$(mktemp -d "$root/mount.XXXXXX")"
            (
              hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$image"
              trap 'hdiutil detach "$mount"' EXIT
              codesign --verify --deep --strict "$mount/BranchNote.app"
              [[ "$(defaults read "$mount/BranchNote.app/Contents/Info" CFBundleShortVersionString)" == "$expected" ]]
              if [[ -d "$root/BranchNote.app" ]]; then
                mv "$root/BranchNote.app" "$root/previous.app"
              fi
              ditto "$mount/BranchNote.app" "$root/BranchNote.app"
            )
          }
          launch() {
            "$root/BranchNote.app/Contents/MacOS/BranchNote" --user-data-dir="$root/profile" >"$root/app.log" 2>&1 &
            local pid=$!
            sleep 8
            if ! kill -0 "$pid" 2>/dev/null; then cat "$root/app.log"; return 1; fi
            kill -TERM "$pid"
            wait "$pid" || true
            [[ -d "$root/profile" ]]
          }
          install "$RUNNER_TEMP/branchnote-baseline/BranchNote-0.2.6-mac-arm64.dmg" 0.2.6
          launch
          install release/mac/BranchNote-0.2.7-mac-arm64.dmg 0.2.7
          launch
          hdiutil verify release/mac/BranchNote-0.2.7-mac-x64.dmg
      - name: Upload validation installers
        uses: actions/upload-artifact@v4
        with:
          name: branchnote-v0.2.7-${{ matrix.platform }}-validation-only
          path: release/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 3
      - name: Require Electron UI verification to pass
        if: always() && steps.updater_ui.outcome == 'failure'
        shell: bash
        run: exit 1
